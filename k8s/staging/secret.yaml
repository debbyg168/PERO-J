# Staging Secret template for PERO-J (testnet).
#
# ⚠ This file is a TEMPLATE with placeholder values — do NOT apply it directly
# to the cluster. The deploy-staging GitHub Actions workflow creates the real
# `pero-secrets` Secret in the `pero-j-staging` namespace from repository
# secrets (STAGING_DATABASE_URL, STAGING_API_ADMIN_KEY), so real credentials
# are never committed to git.
#
# For local/minikube staging you may fill these in and apply manually:
#   kubectl apply -f k8s/staging/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: pero-secrets
  namespace: pero-j-staging
  labels:
    app.kubernetes.io/name: pero-j
    app.kubernetes.io/environment: staging
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@postgres:5432/pero"
  API_ADMIN_KEY: "REPLACE_ME"
  # Optional: only set if the staging indexer should submit decoded events
  # on-chain via the ExplorerContract. Leave blank to index without submission.
  SOROBAN_EXPLORER_ADMIN_SECRET: ""
