[package]
name = "explorer-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

# This crate contains STUB integration tests only.
# It is intentionally excluded from the workspace so that
# `cargo test` at the root does not attempt to compile it
# without a properly configured WASM + sandbox environment.

[dev-dependencies]
# stellar-cli process invocation helper (used to drive the CLI programmatically)
assert_cmd = "=2.0.16"
predicates = "=3.1.3"
tempfile = "=3.13.0"
proptest = "=1.4.0"
